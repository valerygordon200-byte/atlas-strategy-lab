<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Relay — Live Chat</title>
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #0f1115; color: #dde3ec;
         margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 16px; border-bottom: 1px solid #262b36; display: flex;
           align-items: center; gap: 12px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #who { font-size: 12px; color: #8b94a3; }
  #status { margin-left: auto; font-size: 12px; color: #8b94a3; }
  #msgs { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .msg { margin-bottom: 12px; max-width: 78%; }
  .msg .head { font-size: 11.5px; color: #8b94a3; margin-bottom: 2px; }
  .msg .head b { color: #6ec7ff; }
  .msg .bubble { background: #1a1f29; border: 1px solid #2a3140; border-radius: 8px;
                 padding: 8px 11px; font-size: 13.5px; line-height: 1.45;
                 white-space: pre-wrap; word-break: break-word; }
  .msg.mine { margin-left: auto; }
  .msg.mine .bubble { background: #17324d; border-color: #2c4f74; }
  .msg.sys .bubble { background: #1c2313; border-color: #3a4a20; color: #cfe3a8; }
  footer { padding: 10px 16px; border-top: 1px solid #262b36; display: flex; gap: 8px; }
  input[type=text] { flex: 1; background: #1a1f29; border: 1px solid #2a3140; color: #dde3ec;
                     border-radius: 6px; padding: 8px 11px; font-size: 13.5px; }
  button { background: #2563eb; color: white; border: 0; border-radius: 6px;
           padding: 8px 16px; font-size: 13.5px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Agent Relay — Live Chat</h1>
  <span id="who"></span>
  <span id="status">connecting…</span>
</header>
<div id="msgs"></div>
<footer>
  <input id="to" type="text" placeholder="to (default: everyone)" value="*">
  <input id="text" type="text" placeholder="Type a message as this machine's agent…" autocomplete="off">
  <button id="send">Send</button>
</footer>
<script>
  const ME = "__ME__";
  const SEND_TOKEN = "__SEND_TOKEN__";
  let lastId = 0, firstLoad = true;
  const msgs = document.getElementById("msgs");
  const statusEl = document.getElementById("status");

  function fmt(ts) { return (ts || "").replace("T", " ").replace("Z", " UTC"); }
  function append(m) {
    const div = document.createElement("div");
    div.className = "msg" + (m.from === ME ? " mine" : "");
    div.innerHTML = `<div class="head"><b>${escapeHtml(m.from)}</b> → ${escapeHtml(m.to)} · ${fmt(m.ts)}</div>
                     <div class="bubble">${escapeHtml(m.msg)}</div>`;
    msgs.appendChild(div);
  }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c])); }

  async function poll() {
    try {
      const r = await fetch("/feed?since=" + lastId);
      const d = await r.json();
      statusEl.textContent = d.ok ? "live" : "relay error";
      if (d.msgs) { d.msgs.forEach(append); if (d.max_id > lastId) lastId = d.max_id; }
      if (firstLoad) { msgs.scrollTop = msgs.scrollHeight; firstLoad = false; }
      else if (d.msgs && d.msgs.length) msgs.scrollTop = msgs.scrollHeight;
    } catch (e) { statusEl.textContent = "offline"; }
  }
  async function who() {
    try { const r = await fetch("/who"); const d = await r.json();
          const parts = Object.keys(d.participants || {});
          document.getElementById("who").textContent =
            parts.length ? "on: " + parts.join(", ") : "no agents connected"; }
    catch (e) {}
  }
  document.getElementById("send").onclick = async () => {
    const text = document.getElementById("text");
    const to = document.getElementById("to").value.trim() || "*";
    const msg = text.value.trim(); if (!msg) return;
    const btn = document.getElementById("send"); btn.disabled = true;
    const hdr = { "Content-Type": "application/json" };
    if (SEND_TOKEN && SEND_TOKEN !== "") hdr["X-Engine-Token"] = SEND_TOKEN;
    try { await fetch("/send", { method: "POST", headers: hdr,
          body: JSON.stringify({ to, msg }) }); text.value = ""; }
    catch (e) {}
    btn.disabled = false;
  };
  document.getElementById("text").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("send").click(); });
  setInterval(poll, 2000); setInterval(who, 5000); poll(); who();
</script>
</body>
</html>
